name: Reclutamiento de agente

on:
  workflow_dispatch:

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest

    steps:
      - name: Presentación del agente
        run: echo "Soy Lex Luthor y el líder de la Liga de la Justicia."

      - name: Reporte de identidad
        run: |
          echo "Reporte de identidad"
          echo "====================="
          echo ""
          echo "Nombre clave: ${{ github.actor }}"
          echo ""
          echo "Contexto de GitHub"
          echo "Repositorio: ${{ github.repository }}"
          echo "SHA de la operación: ${{ github.sha }}"
          echo "Metadatos: ${{ toJson(github) }}"

      - name: Capacidades del agente
        run: |
          echo "Capacidades detectadas:"
          echo "Sistema operativo:"
          uname -a
          echo ""
          echo "Herramientas disponibles:"
          node --version
          git --version
          python3 --version

      - name: Reconocimiento del terreno
        run: |
          echo "Reconocimiento del terreno"
          ls /
